
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recámara 3D de David - VR</title>

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #111827;
            font-family: Arial, sans-serif;
        }

        a-scene {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .titulo {
            position: fixed;
            z-index: 10;
            top: 12px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: clamp(14px, 4vw, 24px);
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px black;
            pointer-events: none;
        }

        .controles {
            position: fixed;
            z-index: 20;
            top: 48px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 8px;
        }

        .controles button {
            border: 1px solid #00D9FF;
            border-radius: 25px;
            padding: 11px 14px;
            color: white;
            background: rgba(10, 20, 40, 0.94);
            font-size: 13px;
            font-weight: bold;
        }

        .controles button:active {
            background: #00D9FF;
            color: #111827;
        }

        .instruccion {
            position: fixed;
            z-index: 10;
            bottom: 12px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 12px;
            padding: 0 10px;
            text-shadow: 0 2px 8px black;
            pointer-events: none;
        }

        body.en-vr .titulo,
        body.en-vr .instruccion,
        body.en-vr .controles {
            display: none;
        }
    </style>

    <script>
        AFRAME.registerComponent('cambiar-cielo', {
            init: function () {
                const esfera = this.el;
                const cielo = document.querySelector('#bg');

                const cambiarColor = function () {
                    cielo.setAttribute(
                        'color',
                        esfera.getAttribute('color')
                    );
                };

                esfera.addEventListener('mouseenter', cambiarColor);
                esfera.addEventListener('click', cambiarColor);
            }
        });

        AFRAME.registerComponent('detectar-vr', {
            init: function () {
                this.el.addEventListener('enter-vr', () => {
                    document.body.classList.add('en-vr');
                });

                this.el.addEventListener('exit-vr', () => {
                    document.body.classList.remove('en-vr');
                });
            }
        });
    </script>
</head>

<body>

    <div class="titulo">RECÁMARA 3D DE DAVID</div>

    <div class="controles">
        <button id="normal">VISTA NORMAL</button>
        <button id="vr">🥽 ACTIVAR VISTA VR</button>
    </div>

    <div class="instruccion">
        MIRA LAS ESFERAS PARA CAMBIAR EL COLOR DEL CIELO
    </div>

    <a-scene
        detectar-vr
        renderer="colorManagement: true; antialias: true"
        vr-mode-ui="enabled: true"
        cursor="rayOrigin: mouse"
        raycaster="objects: .interactivo">

        <!-- ILUMINACIÓN -->
        <a-entity light="type: ambient; color: #FFFFFF; intensity: 1.1"></a-entity>

        <a-entity
            light="type: directional; color: #FFFFFF; intensity: 1.5"
            position="-3 8 5"></a-entity>

        <a-entity
            light="type: point; color: #00D9FF; intensity: 1.2; distance: 15"
            position="-3 3 -3"></a-entity>

        <a-entity
            light="type: point; color: #FF38B8; intensity: 1.2; distance: 15"
            position="3 3 -4"></a-entity>

        <!-- PARED TRASERA -->
        <a-box position="0 3 -7"
            width="14" height="6" depth="0.25"
            color="#263449"
            material="roughness: 0.9"></a-box>

        <!-- PANEL DECORATIVO -->
        <a-box position="0 3 -6.82"
            width="5" height="4.2" depth="0.08"
            color="#34495E"></a-box>

        <a-box position="-2.1 3 -6.72"
            width="0.04" height="4" depth="0.03"
            color="#00D9FF"></a-box>

        <a-box position="2.1 3 -6.72"
            width="0.04" height="4" depth="0.03"
            color="#FF38B8"></a-box>

        <a-box position="0 4.5 -6.7"
            width="2.6" height="0.045" depth="0.04"
            color="#00D9FF"></a-box>

        <a-text value="DREAM SPACE"
            position="0 4.05 -6.65"
            color="#FFFFFF"
            width="5"
            align="center"></a-text>

        <!-- ESFERAS INTERACTIVAS -->
        <a-sphere class="interactivo" cambiar-cielo
            position="-2.4 2 -4.5"
            radius="0.48" color="#00C8FF"
            material="metalness: 0.25; roughness: 0.2"
            animation="property: position; to: -2.4 2.12 -4.5; dir: alternate; dur: 1800; loop: true"></a-sphere>

        <a-sphere class="interactivo" cambiar-cielo
            position="-0.8 2 -4.5"
            radius="0.48" color="#B14CFF"
            material="metalness: 0.25; roughness: 0.2"
            animation="property: position; to: -0.8 2.12 -4.5; dir: alternate; dur: 1600; loop: true"></a-sphere>

        <a-sphere class="interactivo" cambiar-cielo
            position="0.8 2 -4.5"
            radius="0.48" color="#FF38B8"
            material="metalness: 0.25; roughness: 0.2"
            animation="property: position; to: 0.8 2.12 -4.5; dir: alternate; dur: 1900; loop: true"></a-sphere>

        <a-sphere class="interactivo" cambiar-cielo
            position="2.4 2 -4.5"
            radius="0.48" color="#38FCA8"
            material="metalness: 0.25; roughness: 0.2"
            animation="property: position; to: 2.4 2.12 -4.5; dir: alternate; dur: 1700; loop: true"></a-sphere>

        <!-- BASES -->
        <a-cylinder position="-2.4 1.45 -4.5"
            radius="0.62" height="0.12" color="#1A2636"></a-cylinder>

        <a-cylinder position="-0.8 1.45 -4.5"
            radius="0.62" height="0.12" color="#1A2636"></a-cylinder>

        <a-cylinder position="0.8 1.45 -4.5"
            radius="0.62" height="0.12" color="#1A2636"></a-cylinder>

        <a-cylinder position="2.4 1.45 -4.5"
            radius="0.62" height="0.12" color="#1A2636"></a-cylinder>

        <!-- PISO DE MADERA -->
        <a-plane rotation="-90 0 0"
            position="0 0 0"
            width="50" height="50"
            color="#80512F"
            material="roughness: 0.85"></a-plane>

        <!-- TABLAS -->
        <a-box position="0 0.012 -10" width="50" height="0.025" depth="1.5" color="#96633D"></a-box>
        <a-box position="0 0.012 -8.5" width="50" height="0.025" depth="1.5" color="#704426"></a-box>
        <a-box position="0 0.012 -7" width="50" height="0.025" depth="1.5" color="#A87549"></a-box>
        <a-box position="0 0.012 -5.5" width="50" height="0.025" depth="1.5" color="#80512F"></a-box>
        <a-box position="0 0.012 -4" width="50" height="0.025" depth="1.5" color="#96633D"></a-box>
        <a-box position="0 0.012 -2.5" width="50" height="0.025" depth="1.5" color="#704426"></a-box>
        <a-box position="0 0.012 -1" width="50" height="0.025" depth="1.5" color="#A87549"></a-box>
        <a-box position="0 0.012 0.5" width="50" height="0.025" depth="1.5" color="#80512F"></a-box>
        <a-box position="0 0.012 2" width="50" height="0.025" depth="1.5" color="#96633D"></a-box>
        <a-box position="0 0.012 3.5" width="50" height="0.025" depth="1.5" color="#704426"></a-box>
        <a-box position="0 0.012 5" width="50" height="0.025" depth="1.5" color="#A87549"></a-box>

        <!-- JUNTAS -->
        <a-box position="0 0.03 -9.25" width="50" height="0.008" depth="0.025" color="#49301F"></a-box>
        <a-box position="0 0.03 -7.75" width="50" height="0.008" depth="0.025" color="#49301F"></a-box>
        <a-box position="0 0.03 -6.25" width="50" height="0.008" depth="0.025" color="#49301F"></a-box>
        <a-box position="0 0.03 -4.75" width="50" height="0.008" depth="0.025" color="#49301F"></a-box>
        <a-box position="0 0.03 -3.25" width="50" height="0.008" depth="0.025" color="#49301F"></a-box>
        <a-box position="0 0.03 -1.75" width="50" height="0.008" depth="0.025" color="#49301F"></a-box>
        <a-box position="0 0.03 -0.25" width="50" height="0.008" depth="0.025" color="#49301F"></a-box>
        <a-box position="0 0.03 1.25" width="50" height="0.008" depth="0.025" color="#49301F"></a-box>
        <a-box position="0 0.03 2.75" width="50" height="0.008" depth="0.025" color="#49301F"></a-box>
        <a-box position="0 0.03 4.25" width="50" height="0.008" depth="0.025" color="#49301F"></a-box>

        <!-- CIELO -->
        <a-sky id="bg" color="#111827"></a-sky>

        <!-- CÁMARA -->
        <a-camera
            id="camara"
            position="0 1.7 2.5"
            look-controls="magicWindowTrackingEnabled: true">

            <a-cursor
                color="#FFFFFF"
                fuse="true"
                fuse-timeout="1200"
                raycaster="objects: .interactivo"
                geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.014"
                material="shader: flat; color: #FFFFFF">
            </a-cursor>

        </a-camera>

    </a-scene>

    <script>
        const escena = document.querySelector('a-scene');
        const botonVR = document.querySelector('#vr');
        const botonNormal = document.querySelector('#normal');

        async function esperarEscena() {
            if (escena.hasLoaded) return;

            await new Promise(resolve => {
                escena.addEventListener('loaded', resolve, {
                    once: true
                });
            });
        }

        botonVR.addEventListener('click', async () => {
            try {
                await esperarEscena();
                await escena.enterVR();
            } catch (error) {
                alert(
                    'No se pudo activar la vista VR. ' +
                    'Abre la página con HTTPS y utiliza un ' +
                    'navegador compatible con A-Frame VR.'
                );
                console.error(error);
            }
        });

        botonNormal.addEventListener('click', async () => {
            await esperarEscena();

            if (escena.is('vr-mode')) {
                escena.exitVR();
            }
        });
    </script>

</body>
</html>
